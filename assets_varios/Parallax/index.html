<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Suave 2025 – Solo CSS</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
        height: 400vh;               /* mucho scroll para ver el efecto */
        background: #000;
        color: white;
        font-family: -apple-system, sans-serif;
        overflow-x: hidden;
    }

    /* Contenedor que activa la timeline */
    .parallax-container {
        height: 300vh;               /* altura total del efecto */
        position: relative;
        view-timeline-name: --parallax;
    }

    /* Todas las capas son absolutas y se mueven con scroll */
    .layer {
        position: fixed;             /* o absolute si prefieres */
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;        /* para que no bloquee clicks */
        will-change: transform;
    }

    /* ===== VELOCIDADES DIFERENTES ===== */
    .bg         { background: linear-gradient(#0a0033, #1a0033); }
    .mountains  { background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920') center/cover; }
    .trees      { background: url('https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=1920') center/cover; }
    .fog        { background: linear-gradient(transparent, rgba(0,0,50,0.6)); }
    .title      { 
        font-size: 10vw; 
        font-weight: 900; 
        text-align: center;
        pointer-events: auto;
    }

    /* Movimientos suaves según el scroll */
    .bg        { animation: move-slow both linear;      animation-timeline: --parallax; }
    .mountains { animation: move-medium both linear;    animation-timeline: --parallax; }
    .trees     { animation: move-fast both linear;      animation-timeline: --parallax; }
    .fog       { animation: move-faster both linear;    animation-timeline: --parallax; }
    .title     { animation: move-title both ease-out;   animation-timeline: --parallax; }

    @keyframes move-slow   {   to { transform: translateY(30vh); } }
    @keyframes move-medium {   to { transform: translateY(20vh); } }
    @keyframes move-fast   {   to { transform: translateY(10vh); } }
    @keyframes move-faster {   to { transform: translateY(-15vh); } }
    @keyframes move-title  {   to { transform: translateY(-50vh) scale(0.6); opacity: 0.3; } }

section { 
    height: 300vh;
    background: linear-gradient(#000, #222);
    view-timeline-name: --hero;
}
h1 { 
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 14vw;
    animation: hero both; animation-timeline: --hero;
}
@keyframes hero { to { transform: translate(-50%,-100vh) scale(0.4); opacity: 0; } }
 
</style>
</head>
<body>
<div class="parallax-container">

    <div class="layer bg"></div>
    <div class="layer mountains"></div>
    <div class="layer trees"></div>
    <div class="layer fog"></div>

    <div class="layer title">
        <h1>PARALLAX<br>2025</h1>
    </div>

</div>

<!-- Contenido después del efecto -->
<div style="height:100vh; background:#111; display:grid; place-items:center;">
    <h2>¡Ya llegaste al final!</h2>
</div>


</body>
</html>
