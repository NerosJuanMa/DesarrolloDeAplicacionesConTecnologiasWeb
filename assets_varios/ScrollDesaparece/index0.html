<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"  >
    <title>Scroll Desaparece</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 250vh;            
            background: linear-gradient(to bottom, #0e0e0e, #4f4d4d);
            font-family: Arial, sans-serif;
            overflow-x: hidden;            
        }
        section {
            height: 100vh;                    /* ¡IMPORTANTE! height fijo */
            position: sticky;                 /* ← LA CLAVE */
            top: 0;                           /* ← LA CLAVE */
            display: grid;
            place-items: center;
            view-timeline-name: --seccion;            
        }

        .bloq1 {
            font-size: 0.8rem;                  /* Grande y responsive */
            font-weight: 800;
            line-height: 1.5;
            text-align: center;
            margin: 0;
            padding: 0;
            /* Esto evita que el crecimiento desplace el layout */
            transform-origin: center center;     
        }
        .nuevo {
            display: block;
            font-size: 1.8rem;
            color: #09f;
            animation: ocultar both ease-in-out;
            animation-timeline: --seccion;
            animation-range: entry 0% exit 30%;
        }
        .iPhone {
            color: #ffffff;
            display: block;
            animation: crecer both ease-out;                      
            animation-timeline: --seccion;
            animation-range: entry 0% exit 30%;
                          
        }

        @keyframes crecer {
        to { scale: 3; opacity: 0; }
        }
        @keyframes ocultar {
        to { opacity: 0; }
        }

        .bloq2 {
            font-size: 1.8rem;                  /* Grande y responsive */
            font-weight: 800;
            line-height: 1.5;
            text-align: center;
            margin: 0;
            padding: 0;
            /* Esto evita que el crecimiento desplace el layout */
            transform-origin: center center;   
            }
       
       
    </style>
</head>
<body>
    <main>
        <section class="sec1">
            <div class="bloq1">
                <h1>
                    <span class="nuevo">Nuevo</span>
                    <span class="iPhone">iPhone 15 Pro</span>
                </h1>
            </div>
        </section>
        <section class="sec2">
            <div class="bloq2">
                <h3>Y todo con solo CSS 🔥</h3>
            </div>            
        </section>
    </main>
</body>
</html>
