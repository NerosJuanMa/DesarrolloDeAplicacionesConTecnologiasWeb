<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 15 Pro - Efecto Scroll como Apple (CSS puro)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10rem;
            background: #000;
            color: white;
            overflow-x: hidden;
        }

        section {
            min-height: 100vh;
            display: grid;
            place-items: center;
            view-timeline-name: --section;  /* Nombre único por sección */
        }

        h1 {
            font-size: 13vw;            /* Tamaño responsive como en el vídeo */
            font-weight: 800;
            line-height: 0.9;
            text-align: center;
        }

        h1 span:first-of-type {
            display: block;
            font-size: 0.28em;          /* "Nuevo"" o "Nuevo" más pequeño */
            color: #0066ff;             /* Azul Apple */
            font-weight: 600;
        }

        /* ==== ANIMACIONES ==== */
        @keyframes grow {
            to { scale: 2.8; }          /* Crece mucho, como en el reel */
        }

        @keyframes fade {
            to { opacity: 0; }
        }

        /* "Nuevo" se desvanece antes */
        .nuevo {
            animation: fade both linear;
            animation-timeline: --section;
            animation-range: exit 0% exit 70%;   /* Empieza a desaparecer antes */
        }

        /* "iPhone 15 Pro" crece y luego desaparece */
        .titulo {
            animation: 
                grow both ease-out,
                fade both linear;
            animation-timeline: --section;
            animation-range: 
                exit 0% exit 100%,      /* Crece durante todo el scroll */
                exit 60% exit 100%;     /* Empieza a desvanecerse más tarde */
        }

        /* Sección 1: la del título grande */
        section:nth-of-type(1) {
            height: 100vh;
        }

        /* Sección 2: solo para tener más scroll y ver el efecto completo */
        section:nth-of-type(2) {
            height: 200vh;
            background: linear-gradient(to bottom, #000 0%, #111 100%);
        }

        section:nth-of-type(2) h3 {
            font-size: 4rem;
            font-weight: 300;
        }
