<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 Biblioteca Personal CRUD</title>
  <link rel="stylesheet" href="otrostyles.css"/>
  <script src="otroscript.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>
        <img src="libro.png" alt="Icono de libro" class="header-icon">
        Biblioteca Personal
    </h1>
  </header>

  <main class="container">
    
    <section aria-labelledby="form-title" class="section-form">
      <h2 id="form-title" class="visually-hidden">Añadir Nuevo Libro</h2>
      
      <form id="form-libro" class="card form" aria-describedby="msg">
        <fieldset>
          <legend class="visually-hidden">Datos del Libro</legend>
          <input id="titulo" name="titulo" placeholder="Título *" required aria-label="Título del libro" />
          <input id="autor"  name="autor"  placeholder="Autor *" required aria-label="Autor del libro" />
          <input id="anio"   name="anio"   placeholder="Año (opcional)" type="number" min="0" step="1" aria-label="Año de publicación" />
        </fieldset>
        
        <button type="submit">➕ Añadir libro</button>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <div class="toolbar" role="toolbar" aria-controls="grid">
      <button id="recargar" aria-label="Recargar lista de libros">
        🔁 Recargar
      </button>
    </div>

    <section aria-labelledby="list-title" class="section-list">
      <h2 id="list-title" class="visually-hidden">Lista de Libros Disponibles</h2>
      <div id="grid" class="grid" role="log" aria-live="polite">
        <p class="empty">Carga inicial de la lista...</p>
      </div>
    </section>
    
    <section class="project-deep-dive" aria-labelledby="deep-dive-title">
      </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Mini Biblioteca API. Implementación con Express y Vanilla JS.</p>
  </footer>
</body>
</html>
