<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - Productos y Pedidos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- SECCIÓN DE PRODUCTOS -->
    <section class="productos-section">
      <h1>Productos</h1>
      
      <!-- Formulario para crear/editar producto -->
      <div class="form-card">
        <h3>Agregar Producto</h3>
        <form id="productoForm">
          <input type="text" id="nombre" placeholder="Nombre" required>
          <input type="number" id="precio" placeholder="Precio" step="0.01" required>
          <input type="number" id="stock" placeholder="Stock" value="0">
          <input type="text" id="imagen" placeholder="URL Imagen (opcional)">
          <button type="submit">Crear Producto</button>
        </form>
      </div>

      <!-- Lista de productos -->
      <div class="productos-list" id="productosList"></div>
    </section>

    <!-- SECCIÓN DE PEDIDO ACTUAL -->
    <section class="pedido-section">
      <h1>Carrito de Pedido</h1>
      
      <div class="form-card">
        <input type="text" id="cliente" placeholder="Nombre del cliente" required>
        <div class="carrito" id="carrito">
          <p class="empty-message">Agrega productos desde la lista</p>
        </div>
        <div class="total">
          <strong>Total: $<span id="totalPedido">0.00</span></strong>
        </div>
        <button id="crearPedido" class="btn-pedido">Crear Pedido</button>
      </div>

      <!-- Lista de pedidos -->
      <h3>Pedidos Realizados</h3>
      <div class="pedidos-list" id="pedidosList"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
