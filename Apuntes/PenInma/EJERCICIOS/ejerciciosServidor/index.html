<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión a Node.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    </style>
</head>
<body class="p-8">

    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-lg w-full text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Prueba de Conexión Cliente-Servidor</h1>
        
        <!-- Botón que inicia la conexión -->
        <button id="connectButton" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-md transform hover:scale-105"
                onclick="conectarServidor()">
            Conectar al Servidor Node.js
        </button>

        <p id="statusMessage" class="mt-8 text-lg font-medium text-gray-600">
            Esperando conexión...
        </p>

        <div id="responseContainer" class="mt-4 p-4 bg-gray-100 rounded-lg border border-gray-300 text-left">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Respuesta del Servidor (Cuerpo):</h3>
            <p id="responseText" class="text-gray-900 font-mono text-sm break-words">[No se ha recibido respuesta]</p>
        </div>
    </div>

    <script>
        // Función que reemplaza la llamada onclick en el HTML
        async function conectarServidor() {
            const url = 'http://localhost:3000';
            const statusMessage = document.getElementById('statusMessage');
            const responseText = document.getElementById('responseText');

            statusMessage.textContent = 'Intentando conectar a ' + url + '...';
            responseText.textContent = '[Cargando...]';

            try {
                // 1. Iniciar la petición (Asíncrona)
                const response = await fetch(url);

                // 2. Comprobar el código de estado (2xx es éxito)
                if (response.ok) { 
                    const data = await response.text(); // Obtener el cuerpo como texto
                    
                    statusMessage.className = 'mt-8 text-lg font-medium text-green-600';
                    statusMessage.textContent = '✅ Conexión Exitosa. Código HTTP: ' + response.status;
                    responseText.textContent = data;
                } else {
                    // Si recibimos 404, 500, etc.
                    statusMessage.className = 'mt-8 text-lg font-medium text-red-600';
                    statusMessage.textContent = '❌ Error del servidor. Código HTTP: ' + response.status;
                    responseText.textContent = await response.text() || '[El servidor no proporcionó un cuerpo de error]';
                }

            } catch (error) {
                // Si la petición falla por problemas de red, CORS, o servidor apagado
                statusMessage.className = 'mt-8 text-lg font-medium text-red-600';
                statusMessage.textContent = '🔴 ERROR: No se pudo conectar al servidor. Asegúrate de que server.js está corriendo en el puerto 3000.';
                responseText.textContent = 'Detalles del error: ' + error.message;
            }
        }
    </script>
</body>
</html>
