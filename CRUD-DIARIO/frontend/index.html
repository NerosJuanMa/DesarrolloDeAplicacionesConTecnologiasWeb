<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Diario Personal</title>
  <!-- <link rel="stylesheet" href="styles.css"> -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      max-width: 400px;
      margin: 0 auto 2rem;
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 0.3rem;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.7rem;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #botonMostrar {
      display: block;
      margin: 0 auto 2rem;
      background-color: #10b981;
    }
    #botonMostrar:hover {
      background-color: #059669;
    }
    #diarioList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .diario-card {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .diario-card h3 {
      margin-top: 0;
      color: #2563eb;
    }
    #total-diario {
      display: block;
      text-align: center;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    #mensaje {
      text-align: center;
      color: #444;
      margin-bottom: 1rem;
    }
    #loading {
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <h1>📔 Mi Diario Personal</h1>

  <!-- FORMULARIO -->
  <form id="formulario-diario">
    <label for="dia">Día</label>
    <input type="text" id="dia" placeholder="Ej: Lunes 3 de noviembre" />

    <label for="anotacion">Anotación</label>
    <textarea id="anotacion" rows="3" placeholder="¿Qué pasó hoy?"></textarea>

    <label for="estado">Estado</label>
    <select id="estado">
      <option value="">Selecciona un estado...</option>
      <option value="Feliz">Feliz</option>
      <option value="Triste">Triste</option>
      <option value="Cansado">Cansado</option>
      <option value="Motivado">Motivado</option>
      <option value="Neutral">Neutral</option>
    </select>

    <button id="botonGuardar" type="submit">Guardar entrada</button>
  </form>

  <!-- BOTÓN DE MOSTRAR -->
  <button id="botonMostrar">Mostrar todas las entradas</button>

  <!-- ELEMENTOS DE INFORMACIÓN -->
  <span id="total-diario">Total de entradas: 0</span>
  <div id="mensaje"></div>
  <div id="loading">Cargando...</div>

  <!-- CONTENEDOR DE RESULTADOS Y LISTA -->
  <ul id="resultados"></ul>
  <div id="diarioList"></div>

  <!-- Enlace al script -->
  <script src="./script.js"></script>
</body>
</html>
